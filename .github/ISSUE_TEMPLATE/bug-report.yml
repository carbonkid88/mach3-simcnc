name: Bug report
description: Report a reproducible problem in the application
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: tool-version
    attributes:
      label: Tool version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - GUI
        - Parser
        - Localization
        - simCNC reference inspection
        - Tests
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the tool
        2. Load ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output or screenshots
      description: Paste relevant terminal output or attach screenshots.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed or anonymized private profile data before sharing.
          required: true
